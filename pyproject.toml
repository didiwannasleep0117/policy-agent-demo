[project]
name = "policy-agent-demo"
version = "0.1.0"
description = "Demo: 公司規章 RAG agent（MCP + n8n + Ollama），全部假資料"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fpdf2>=2.8.9",
    "httpx>=0.28.1",
    "mcp[cli]<2",
    "openpyxl>=3.1.5",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
]

[project.scripts]
policy-mcp = "policy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_mcp"]
