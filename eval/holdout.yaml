# 隱藏組（holdout）：改進循環「看不到」這一組，只在最後拿來確認有沒有過擬合
# 不要依這組的錯題去改 prompt，否則它就不再是隱藏組
- q: 外婆過世可以請幾天喪假？
  expect_file: 請假管理辦法.docx
  must_contain: [["六日"], ["6日"], ["6 日"], ["六天"], ["6天"], ["6 天"]]
- q: 請事假有薪水嗎？一年最多可以請幾天？
  expect_file: 請假管理辦法.docx
  must_contain: [["不給", "十四"], ["不給", "14"], ["無薪", "十四"], ["無薪", "14"], ["沒有", "14"], ["沒有", "十四"], ["不支薪", "14"], ["不支薪", "十四"]]
- q: 我跟同事結婚，我們兩個都可以領結婚禮金嗎？
  expect_file: 婚喪喜慶補助辦法.pdf
  must_contain: [["各自"]]
- q: 生理假今年才請 2 天，會被算進病假嗎？
  expect_file: 請假管理辦法.docx
  must_contain: [["不併入"], ["不會"]]
- q: 出差可以搭計程車報帳嗎？
  expect_file: 差旅與報銷作業辦法.docx
  must_contain: [["說明"]]
- q: 費用發生 40 天後才報銷，會怎樣？
  expect_file: 差旅與報銷作業辦法.docx
  must_contain: [["財務長"]]
- q: 我要買一台 2 萬 5 的伺服器，可以先自己買再報帳嗎？
  expect_file: 差旅與報銷作業辦法.docx
  must_contain: [["請購"]]
- q: 我月薪 6 萬，考績 A，年終獎金是多少？
  expect_file: 考績管理辦法.docx
  must_contain: [["135,000"], ["135000"], ["13.5 萬"], ["13.5萬"]]
- q: 補休如果六個月內沒休完會怎樣？
  expect_file: 加班管理辦法.pdf
  must_contain: [["發給"], ["加班費"]]
- q: 公司補助的外部課程超過 5 萬元，有什麼要注意的？
  expect_file: 教育訓練補助辦法.pdf
  must_contain: [["服務契約"]]
- q: 我到職 10 個月，可以申請居家辦公設備補助嗎？
  expect_file: 遠距工作辦法.docx
  must_contain: [["不", "一年"], ["不", "1 年"], ["不", "1年"]]
- q: 遠距工作那天的核心工作時間是幾點到幾點？
  expect_file: 遠距工作辦法.docx
  must_contain: [["十點", "四點"], ["10", "16"], ["10", "4"]]
- q: 我 38 歲，去年做過健康檢查，今年還能做嗎？
  expect_file: 員工健康檢查辦法.pdf
  must_contain: [["兩年"], ["2 年"], ["2年"]]
- q: 看電影有員工優惠嗎？
  expect_file: 特約商店清單.xlsx
  must_contain: [["兩百五十"], ["250"]]
- q: 公司有提供上下班交通車嗎？
  not_found: true
- q: 推薦我台北好吃的拉麵店
  refuse: true
- q: 那如果是父親過世呢？
  before: [奶奶過世可以請幾天喪假？]
  expect_file: 請假管理辦法.docx
  must_contain: [["八日"], ["8日"], ["8 日"], ["八天"], ["8天"], ["8 天"]]
